[project]
name = "uchebniycrm-backend"
version = "1.0.0"
description = "Learning Centre CRM - academic management and finance backend"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1,<5.3",
    "djangorestframework>=3.15",
    "django-filter>=24.3",
    "python-dotenv>=1.0",
    "whitenoise>=6.7",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["apps", "tests"]
python_files = ["test_*.py", "tests.py"]
addopts = "-q --tb=short"
filterwarnings = ["error::DeprecationWarning:apps.*"]
