[project]
name = "uchebniycrm-backend"
version = "1.0.0"
description = "Learning Centre CRM - academic management and finance backend"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1,<5.3",
    "djangorestframework>=3.15",
    "django-filter>=24.3",
    "python-dotenv>=1.0",
    "whitenoise>=6.7",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["apps", "tests"]
python_files = ["test_*.py", "tests.py"]
addopts = "-q --tb=short"
filterwarnings = ["error::DeprecationWarning:apps.*"]

# Hosting metadata read by Vercel when this directory is deployed as a service.
#
# `entrypoint` is pinned rather than auto-detected: settings.py defines both
# WSGI_APPLICATION and ASGI_APPLICATION, and Vercel prefers the ASGI entrypoint
# when both are present. Pinning WSGI keeps the deployed entrypoint the same one
# Gunicorn uses in Docker and the same one the CI suite exercises, so there is
# exactly one entry path to reason about.
[tool.vercel]
entrypoint = "config.wsgi:application"

